name: Deploy Backend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format (check)
        run: ruff format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run tests
        run: docker compose -f deploy/compose.test.yml run --rm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image (latest + sha)
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker build -f deploy/Containerfile -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Sync infra files to server (compose + caddy)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "deploy/compose.dev.yml,deploy/compose.prod.yml,deploy/Caddyfile"
          target: "/opt/cube/backend"

      - name: Deploy on droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/cube/backend

            printf "%s\n%s\n" "${{ vars.ENV_COMMON }}" "${{ secrets.ENV_SECRET }}" > /opt/cube/backend/.env
            chmod 600 /opt/cube/backend/.env

            cd /opt/cube/backend

            IMAGE=ghcr.io/${{ github.repository }}
            docker pull $IMAGE:${{ github.sha }}
            docker tag $IMAGE:${{ github.sha }} $IMAGE:latest

            sudo systemctl disable --now caddy 2>/dev/null || true

            docker compose -f deploy/compose.dev.yml -f deploy/compose.prod.yml down --remove-orphans || true
            docker rm -f main-be-redis main-be-postgres main-be-fastapi main-be-caddy 2>/dev/null || true

            docker compose -f deploy/compose.dev.yml -f deploy/compose.prod.yml up -d
            docker compose -f deploy/compose.dev.yml -f deploy/compose.prod.yml exec -T fastapi alembic upgrade head

            docker image prune -a -f
            docker builder prune -a -f
            docker container prune -f
